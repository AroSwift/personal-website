<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron Barlow — Offline</title>
    <script>
      ;(function () {
        try {
          const theme = localStorage.getItem('theme')
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          } else if (theme === 'light') {
            document.documentElement.classList.add('light')
          }
        } catch {
          // Ignore storage access errors in private browsing
        }
      })()
    </script>
    <style>
      :root {
        --bg: hsl(0 0% 95%);
        --fg: hsl(0 0% 8%);
        --muted: hsl(0 0% 38%);
        --card: hsl(0 0% 100%);
        --border: hsl(0 0% 90%);
        --btn-bg: hsl(0 0% 8%);
        --btn-fg: hsl(0 0% 98%);
      }
      .dark {
        --bg: hsl(0 0% 0%);
        --fg: hsl(0 0% 98%);
        --muted: hsl(0 0% 72%);
        --card: hsl(0 0% 12%);
        --border: hsl(0 0% 27%);
        --btn-bg: hsl(0 0% 98%);
        --btn-fg: hsl(0 0% 2%);
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          --bg: hsl(0 0% 0%);
          --fg: hsl(0 0% 98%);
          --muted: hsl(0 0% 72%);
          --card: hsl(0 0% 12%);
          --border: hsl(0 0% 27%);
          --btn-bg: hsl(0 0% 98%);
          --btn-fg: hsl(0 0% 2%);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        padding: 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      .container {
        text-align: center;
        max-width: 440px;
        width: 100%;
        padding: 2.5rem 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 0 1.75rem;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--btn-bg);
        color: var(--btn-fg);
        padding: 0.625rem 1.25rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      .button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">Offline</div>
      <h1>No internet connection</h1>
      <p>
        You appear to be offline. Previously visited pages remain available from
        cache, or you can retry once your connection returns.
      </p>
      <a href="/" class="button">Try Again</a>
    </main>
    <script>
      window.addEventListener('online', () => {
        window.location.reload()
      })

      document.querySelector('.button').addEventListener('click', e => {
        e.preventDefault()
        window.location.reload()
      })
    </script>
  </body>
</html>
