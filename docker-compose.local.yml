services:
  web:
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    ports:
      - '3000:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Local development - no Traefik labels needed
