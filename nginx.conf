server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Request tracing
  add_header X-Request-ID $request_id always;

  # Security headers
  # Ensure content is not embedded in an iframe from a different domain
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Prevent MIME type sniffing
  add_header X-Content-Type-Options "nosniff" always;
  # Prevent referrer information from being sent to other domains
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Prevent certain permissions from being granted to the content
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Content Security Policy (strict self-hosted policy allowing inline scripts/styles for React & Framer Motion)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

  # SPA fallback (handles /projects, etc.)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Service worker - never cache (repeat security headers because Nginx
  # drops server-level add_header directives inside any location with add_header)
  location = /service-worker.js {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $request_id always;
  }

  # Build output only: these filenames carry a content hash, so they are
  # genuinely immutable and safe to pin for a year.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Everything else served from public/ (profile images, icons, favicon,
  # manifest) has a STABLE filename. Marking those immutable pinned them in
  # the browser for a year, so replacing a photo or an icon never reached
  # returning visitors -- the HTTP cache sits in front of the service worker,
  # so bumping CACHE_VERSION could not rescue it either. Cache them for a day
  # and revalidate.
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
    expires 1d;
    add_header Cache-Control "public, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # HTML files - short cache with revalidation
  location ~* \.html$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    add_header X-Request-ID $request_id always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
  }

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # Brotli compression (preferred over gzip if available)
  # brotli on;
  # brotli_comp_level 6;
  # brotli_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;
}
