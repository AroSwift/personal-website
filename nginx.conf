server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Add debugging headers
  add_header X-Served-By "nginx" always;
  add_header X-Request-ID $request_id always;

  # Security headers
  # Ensure content is not embedded in an iframe from a different domain
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Prevent MIME type sniffing
  add_header X-Content-Type-Options "nosniff" always;
  # Prevent referrer information from being sent to other domains
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Prevent certain permissions from being granted to the content
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Prevent certain permissions from being granted to the content
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;

  # SPA fallback (handles /projects, etc.)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # Service worker - never cache
  location = /service-worker.js {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
  }

  # Cache static assets with long expiry (hash-based cache busting)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML files - short cache with revalidation
  location ~* \.html$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Brotli compression (preferred over gzip if available)
  brotli on;
  brotli_comp_level 6;
  brotli_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;
}
